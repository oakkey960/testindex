<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>ระบบบันทึกผลตรวจสุขภาพเบื้องต้น</title>
<style>
/* ======================================================================
   1) จุดกำหนดค่าธีม (ปรับสี/รูปแบบทั้งระบบได้จากจุดนี้ ควบคู่กับ CONFIG ใน <script>)
   ====================================================================== */
:root{
  --primary:#0d9488;      --primary-dark:#0f766e;   --primary-light:#5eead4;
  --secondary:#6366f1;    --accent:#f59e0b;         --danger:#ef4444;
  --success:#10b981;      --warning:#f59e0b;        --info:#3b82f6;
  --bg:#f4f7f8;           --surface:#ffffff;        --surface-2:#eef2f3;
  --text:#0f172a;         --text-muted:#64748b;     --border:#e2e8f0;
  --glass-bg:rgba(255,255,255,.65); --glass-border:rgba(255,255,255,.4);
  --radius-sm:10px; --radius:16px; --radius-lg:24px;
  --shadow-sm:0 1px 3px rgba(15,23,42,.08);
  --shadow:0 8px 24px -8px rgba(15,23,42,.15);
  --shadow-lg:0 20px 48px -12px rgba(15,23,42,.25);
  --font: 'Sarabun','Noto Sans Thai UI','Leelawadee UI','Segoe UI',Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1220; --surface:#121b2e; --surface-2:#182238;
    --text:#e6edf5; --text-muted:#93a3b8; --border:#243149;
    --glass-bg:rgba(18,27,46,.65); --glass-border:rgba(255,255,255,.08);
  }
}
:root[data-theme="dark"]{
  --bg:#0b1220; --surface:#121b2e; --surface-2:#182238;
  --text:#e6edf5; --text-muted:#93a3b8; --border:#243149;
  --glass-bg:rgba(18,27,46,.65); --glass-border:rgba(255,255,255,.08);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font);}
body{min-height:100vh;-webkit-font-smoothing:antialiased;}
h1,h2,h3,h4{margin:0;font-weight:700;}
p{margin:0;}
button,input,select,textarea{font-family:inherit;}
a{color:var(--primary);}
.hidden{display:none !important;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px;}

/* ======================================================================
   2) Layout / Topbar
   ====================================================================== */
.topbar{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px 20px;background:var(--glass-bg);backdrop-filter:blur(16px) saturate(160%);
  -webkit-backdrop-filter:blur(16px) saturate(160%);
  border-bottom:1px solid var(--glass-border);
}
.brand{display:flex;align-items:center;gap:10px;min-width:0;}
.brand-logo{
  width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;font-size:22px;flex:none;
  box-shadow:var(--shadow-sm);
}
.brand-text{min-width:0;}
.brand-text b{display:block;font-size:15px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.brand-text span{display:block;font-size:11.5px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.nav-btn{
  border:none;background:transparent;color:var(--text-muted);font-weight:600;font-size:13.5px;
  padding:9px 14px;border-radius:999px;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:6px;
}
.nav-btn:hover{background:var(--surface-2);color:var(--text);}
.nav-btn.active{background:var(--primary);color:#fff;box-shadow:var(--shadow-sm);}
.theme-toggle{border:1px solid var(--border);background:var(--surface);width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;}

.page{max-width:1180px;margin:0 auto;padding:20px 16px 64px;animation:fadeIn .35s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

.card{
  background:var(--glass-bg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid var(--glass-border);border-radius:var(--radius);box-shadow:var(--shadow-sm);
  padding:20px;margin-bottom:16px;
}
.card-solid{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:20px;margin-bottom:16px;}
.section-title{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.section-title .ico{width:34px;height:34px;border-radius:10px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;flex:none;}
.section-title h3{font-size:16.5px;}
.section-title small{display:block;color:var(--text-muted);font-size:12px;font-weight:400;}

/* ======================================================================
   3) Form elements
   ====================================================================== */
.field{margin-bottom:14px;}
.field label{display:block;font-size:13.5px;font-weight:600;margin-bottom:6px;color:var(--text);}
.field label .req{color:var(--danger);margin-inline-start:3px;}
.field .hint{font-size:11.5px;color:var(--text-muted);margin-top:4px;}
.field .err{font-size:11.5px;color:var(--danger);margin-top:4px;display:none;font-weight:600;}
.field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--danger) !important;background:rgba(239,68,68,.05);}
.field.invalid .err{display:block;}
.input,select.input,textarea.input{
  width:100%;padding:11px 13px;border-radius:12px;border:1.5px solid var(--border);
  background:var(--surface);color:var(--text);font-size:14.5px;transition:.15s;outline:none;
}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(13,148,136,.14);}
textarea.input{resize:vertical;min-height:70px;}
input[type=color].input{padding:4px;height:44px;cursor:pointer;}
.grid{display:grid;gap:14px;}
.grid-2{grid-template-columns:repeat(2,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
@media(max-width:760px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr 1fr;}}
@media(max-width:520px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}

.choice-group{display:flex;flex-wrap:wrap;gap:8px;}
.choice-card{
  border:1.5px solid var(--border);background:var(--surface);border-radius:12px;padding:10px 16px;
  cursor:pointer;font-size:14px;font-weight:600;color:var(--text-muted);transition:.15s;user-select:none;
  display:flex;align-items:center;gap:8px;
}
.choice-card:hover{border-color:var(--primary-light);}
.choice-card.selected{border-color:var(--primary);background:rgba(13,148,136,.1);color:var(--primary-dark);}
.choice-card.selected .dot{background:var(--primary);}
.choice-card .dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--border);flex:none;}
.choice-card.selected .dot{border-color:var(--primary);position:relative;}
.choice-card.selected .dot::after{content:'';position:absolute;inset:3px;border-radius:50%;background:var(--primary);}
.choice-card.square .dot{border-radius:5px;}
.choice-card.square.selected .dot::after{border-radius:2px;}

.slider-wrap{padding:6px 4px 2px;}
.slider-track{position:relative;height:10px;border-radius:99px;background:linear-gradient(90deg,#ef4444,#f59e0b,#22c55e);}
input[type=range].gauge{
  -webkit-appearance:none;width:100%;height:10px;background:transparent;margin:0;position:relative;top:-10px;
}
input[type=range].gauge::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--primary-dark);box-shadow:var(--shadow-sm);cursor:pointer;margin-top:-6px;}
input[type=range].gauge::-webkit-slider-runnable-track{height:10px;background:transparent;}
input[type=range].gauge::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--primary-dark);cursor:pointer;}
.gauge-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--text-muted);margin-top:2px;}
.gauge-value{font-weight:700;color:var(--primary-dark);}

.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:700;}
.badge-green{background:rgba(16,185,129,.14);color:#0a7a56;}
.badge-amber{background:rgba(245,158,11,.16);color:#92620a;}
.badge-red{background:rgba(239,68,68,.14);color:#b91c1c;}
.badge-gray{background:var(--surface-2);color:var(--text-muted);}
.badge-blue{background:rgba(59,130,246,.14);color:#1d4ed8;}

/* Progress steps */
.progress-wrap{margin-bottom:20px;}
.progress-bar-bg{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;}
.progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--secondary));border-radius:99px;transition:width .3s;}
.steps-row{display:flex;justify-content:space-between;margin-top:10px;gap:4px;}
.step-pill{flex:1;text-align:center;font-size:11.5px;font-weight:700;color:var(--text-muted);padding:6px 2px;border-radius:8px;}
.step-pill.active{color:var(--primary-dark);}
.step-pill.done{color:var(--success);}

/* Buttons */
.btn{border:none;border-radius:12px;padding:11px 20px;font-size:14px;font-weight:700;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:8px;}
.btn:disabled{opacity:.55;cursor:not-allowed;}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;box-shadow:0 8px 18px -6px rgba(13,148,136,.55);}
.btn-primary:hover:not(:disabled){filter:brightness(1.06);}
.btn-secondary{background:var(--surface-2);color:var(--text);}
.btn-secondary:hover{background:var(--border);}
.btn-danger{background:rgba(239,68,68,.12);color:#b91c1c;}
.btn-danger:hover{background:rgba(239,68,68,.2);}
.btn-ghost{background:transparent;color:var(--primary-dark);}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:9px;}
.btn-block{width:100%;justify-content:center;}
.actions-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;}

/* KPI / Dashboard */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
@media(max-width:900px){.kpi-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:480px){.kpi-grid{grid-template-columns:1fr;}}
.kpi-card{cursor:pointer;position:relative;overflow:hidden;}
.kpi-card::after{content:'';position:absolute;right:-30px;top:-30px;width:100px;height:100px;border-radius:50%;background:var(--kpi-color,var(--primary));opacity:.12;}
.kpi-card .kpi-label{font-size:12.5px;color:var(--text-muted);font-weight:600;}
.kpi-card .kpi-value{font-size:30px;font-weight:800;margin-top:4px;color:var(--kpi-color,var(--primary));}
.kpi-card .kpi-sub{font-size:11.5px;color:var(--text-muted);margin-top:4px;}

.chart-card svg{width:100%;height:auto;display:block;}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;}
.legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-muted);cursor:pointer;}
.legend-dot{width:11px;height:11px;border-radius:4px;flex:none;}

table.data-table{width:100%;border-collapse:collapse;font-size:13px;}
table.data-table th{text-align:left;padding:10px 12px;background:var(--surface-2);color:var(--text-muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;position:sticky;top:0;}
table.data-table td{padding:10px 12px;border-bottom:1px solid var(--border);}
table.data-table tr:hover td{background:rgba(13,148,136,.05);}
.table-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--border);}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
.toolbar .input{width:auto;flex:1;min-width:160px;}

/* Modal / Toast */
.overlay{position:fixed;inset:0;background:rgba(10,15,25,.55);backdrop-filter:blur(3px);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;}
.modal{background:var(--surface);border-radius:var(--radius-lg);max-width:640px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-lg);padding:24px;}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;gap:10px;}
.modal-close{border:none;background:var(--surface-2);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:15px;flex:none;}
.toast-wrap{position:fixed;bottom:20px;right:20px;z-index:300;display:flex;flex-direction:column;gap:10px;max-width:340px;}
.toast{background:var(--surface);border-left:4px solid var(--primary);border-radius:12px;padding:13px 16px;box-shadow:var(--shadow-lg);font-size:13.5px;animation:slideIn .25s ease;}
.toast.success{border-color:var(--success);}
.toast.error{border-color:var(--danger);}
.toast.warn{border-color:var(--warning);}
@keyframes slideIn{from{transform:translateX(30px);opacity:0;}to{transform:translateX(0);opacity:1;}}

.info-box{background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.25);border-radius:12px;padding:12px 14px;font-size:12.5px;color:var(--text);line-height:1.7;}
.info-box b{color:var(--info);}
.ref-table{width:100%;font-size:12px;border-collapse:collapse;margin-top:6px;}
.ref-table th,.ref-table td{border:1px solid var(--border);padding:5px 8px;text-align:center;}
.ref-table th{background:var(--surface-2);}

.empty-state{text-align:center;padding:50px 20px;color:var(--text-muted);}
.empty-state .emoji{font-size:44px;margin-bottom:10px;}

.demo-banner{background:linear-gradient(135deg,#fef3c7,#fde68a);color:#78350f;padding:9px 16px;border-radius:12px;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:8px;margin-bottom:16px;}
:root[data-theme="dark"] .demo-banner, @media (prefers-color-scheme:dark){.demo-banner{color:#78350f;}}

.landing-hero{text-align:center;padding:6px 6px 22px;}
.landing-hero h1{font-size:clamp(22px,4vw,30px);background:linear-gradient(135deg,var(--primary),var(--secondary));-webkit-background-clip:text;background-clip:text;color:transparent;}
.landing-hero p{color:var(--text-muted);margin-top:8px;font-size:13.5px;}

.footer-note{text-align:center;color:var(--text-muted);font-size:11.5px;margin-top:30px;}

.spinner{width:16px;height:16px;border-radius:50%;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;animation:spin .7s linear infinite;}
.spinner.dark{border-color:rgba(13,148,136,.25);border-top-color:var(--primary);}
@keyframes spin{to{transform:rotate(360deg);}}

.avatar-select{display:flex;gap:10px;}
.tab-strip{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;background:var(--surface-2);padding:5px;border-radius:14px;width:fit-content;}
.tab-btn{border:none;background:transparent;padding:9px 16px;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer;color:var(--text-muted);}
.tab-btn.active{background:var(--surface);color:var(--primary-dark);box-shadow:var(--shadow-sm);}

@media print{
  .topbar,.no-print,.toast-wrap{display:none !important;}
  body{background:#fff;}
  .page{max-width:100%;padding:0;}
  .card,.card-solid{box-shadow:none;border:1px solid #ccc;}
}
</style>
</head>
<body>

<div class="topbar no-print">
  <div class="brand">
    <div class="brand-logo" id="brandLogo">🩺</div>
    <div class="brand-text">
      <b id="brandTitle">ระบบบันทึกผลตรวจสุขภาพเบื้องต้น</b>
      <span id="brandSubtitle">กลุ่มงานสุขศึกษา</span>
    </div>
  </div>
  <div class="nav" id="mainNav">
    <button class="nav-btn" data-route="form">📝 บันทึกข้อมูล</button>
    <button class="nav-btn" data-route="dashboard">📊 Dashboard</button>
    <button class="nav-btn" data-route="admin">🔐 ผู้ดูแลระบบ</button>
    <button class="theme-toggle" id="themeToggle" title="สลับโหมดสี">🌙</button>
  </div>
</div>

<div id="app"></div>
<div class="toast-wrap" id="toastWrap"></div>
<div id="modalRoot"></div>

<script>
/* ==========================================================================
   CONFIG — จุดกำหนดค่าเดียวของระบบ (ชื่อระบบ/โลโก้/หน่วยงาน/สี/ข้อความ/URL API)
   ========================================================================== */
const CONFIG = {
  systemName: 'ระบบบันทึกผลตรวจสุขภาพเบื้องต้น',
  orgName: 'กลุ่มงานสุขศึกษา โรงพยาบาลพระปกเกล้า',
  headerText: 'โครงการค่ายปฏิบัติการเข้มข้นเสริมพลังความรอบรู้ทางสุขภาพเพื่อลดโรคไม่ติดต่อเรื้อรัง',
  logoEmoji: '🩺',
  primaryColor: '#0d9488',
  secondaryColor: '#6366f1',
  // ใส่ Web App URL จาก Google Apps Script ที่นี่ (ลงท้ายด้วย /exec) เพื่อเปลี่ยนจาก Demo Mode ไปใช้ Google Sheets จริง
  GAS_API_URL: 'https://script.google.com/macros/s/AKfycbxhy8JPtN7ZAidxOjWHTtMiQ89mpmuZqfwBtVZ-oIvwYNexSsrvArPKa_s2E6EDXJ8/exec',
  //https://script.google.com/macros/s/AKfycbyx_mDBktSHclBnADFTRFY4kmD3JPsHdjCYJW37HAohQLIVszbOp-_SSiqdYlWEs7E/exec
  // true = เชื่อมต่อ Google Sheets จริงเฉพาะหน้า Dashboard เท่านั้น (หน้าบันทึกข้อมูล/ผู้ดูแลระบบยังคงเป็น Demo Mode)
  // false = เชื่อมต่อ Google Sheets จริงทั้งระบบ (บันทึกข้อมูล/ผู้ดูแลระบบ/Dashboard) — ค่าเริ่มต้นตามสเปค
  dashboardOnlyRemote: false,
  adminTokenTTLms: 8 * 60 * 60 * 1000
};

/* ==========================================================================
   FIELD SCHEMA — ต้องตรงกับ Code.gs และ Excel Template ทุกตัวอักษร ห้ามตัด/รวม/เปลี่ยนความหมาย
   ========================================================================== */
const FIELD_SCHEMA = [
  { key:'record_id', label:'รหัสรายการ', type:'text', system:true },
  { key:'created_at', label:'วันเวลาที่บันทึก', type:'text', system:true },
  { key:'updated_at', label:'วันเวลาที่แก้ไขล่าสุด', type:'text', system:true },
  { key:'record_status', label:'สถานะรายการ', type:'text', system:true },
  { key:'created_by', label:'ผู้บันทึก', type:'text', system:true },
  { key:'updated_by', label:'ผู้แก้ไขล่าสุด', type:'text', system:true },

  { key:'first_name', label:'ชื่อ', type:'text', required:true, step:1 },
  { key:'last_name', label:'นามสกุล', type:'text', required:true, step:1 },
  { key:'gender', label:'เพศ', type:'select', options:['ชาย','หญิง'], required:true, step:1,
    note:'ฟิลด์เพิ่มเติมจากต้นฉบับ: จำเป็นสำหรับแปลผลตามเกณฑ์ที่แบบฟอร์มต้นฉบับแยกชาย/หญิง' },
  { key:'age', label:'อายุ', unit:'ปี', type:'number', min:0, max:120, required:true, step:1 },
  { key:'occupation', label:'อาชีพ', type:'text', step:1 },
  { key:'phone', label:'เบอร์โทรศัพท์', type:'tel', step:1 },
  { key:'height_cm', label:'ส่วนสูง', unit:'ซม.', type:'number', min:50, max:250, required:true, step:1 },
  { key:'waist_cm', label:'รอบเอว', unit:'ซม.', type:'number', min:30, max:200, required:true, step:1 },
  { key:'disease_diabetes', label:'เบาหวาน', type:'boolean', step:1, group:'disease' },
  { key:'disease_hypertension', label:'ความดัน', type:'boolean', step:1, group:'disease' },
  { key:'disease_lipid', label:'ไขมัน', type:'boolean', step:1, group:'disease' },
  { key:'disease_other', label:'อื่นๆ', type:'boolean', step:1, group:'disease' },
  { key:'disease_other_detail', label:'ระบุโรคประจำตัวอื่นๆ', type:'text', step:1, conditionOf:'disease_other' },

  { key:'weight_kg', label:'น้ำหนัก', unit:'กก.', type:'number', min:10, max:300, required:true, step:2 },
  { key:'body_fat_percent', label:'ไขมันทั่วร่างกาย', unit:'%', type:'number', min:0, max:80, required:true, step:2 },
  { key:'muscle_mass_kg', label:'มวลกล้ามเนื้อ', unit:'กก.', type:'number', min:0, max:150, required:true, step:2 },

function classifyBMI(bmi){
  if(bmi===''||bmi==null||isNaN(bmi)) return null;
  bmi = Number(bmi);
  if(bmi<18.5) return {label:'น้ำหนักต่ำกว่าเกณฑ์',tone:'blue'};
  if(bmi<23) return {label:'ปกติ',tone:'green'};
  if(bmi<25) return {label:'น้ำหนักเกิน',tone:'amber'};
  if(bmi<30) return {label:'โรคอ้วน',tone:'red'};
  return {label:'โรคอ้วนระดับรุนแรง',tone:'red'};
}
function classifyWaist(waist,gender){
  if(!waist||isNaN(waist)||!gender) return null;
  const limit = gender==='ชาย'?90:80;
  return Number(waist)<=limit ? {label:'ปกติ',tone:'green'} : {label:'เกินเกณฑ์มาตรฐานเอเชีย',tone:'amber'};
}
const BODYFAT_TABLE = {
  'หญิง':[{max:39,ranges:[[0,21,'ต่ำกว่าเกณฑ์','blue'],[21,33,'ปกติ','green'],[33,39,'เริ่มอ้วน','amber'],[39,999,'อ้วน','red']]},
          {max:59,ranges:[[0,20,'ต่ำกว่าเกณฑ์','blue'],[20,34,'ปกติ','green'],[34,40,'เริ่มอ้วน','amber'],[40,999,'อ้วน','red']]},
          {max:200,ranges:[[0,25,'ต่ำกว่าเกณฑ์','blue'],[25,36,'ปกติ','green'],[36,42,'เริ่มอ้วน','amber'],[42,999,'อ้วน','red']]}],
  'ชาย':[{max:39,ranges:[[0,9,'ต่ำกว่าเกณฑ์','blue'],[9,20,'ปกติ','green'],[20,25,'เริ่มอ้วน','amber'],[25,999,'อ้วน','red']]},
         {max:59,ranges:[[0,11,'ต่ำกว่าเกณฑ์','blue'],[11,22,'ปกติ','green'],[22,28,'เริ่มอ้วน','amber'],[28,999,'อ้วน','red']]},
         {max:200,ranges:[[0,20,'ต่ำกว่าเกณฑ์','blue'],[20,25,'ปกติ','green'],[25,30,'เริ่มอ้วน','amber'],[30,999,'อ้วน','red']]}]
};
function classifyBodyFat(percent,gender,age){
  if(percent===''||percent==null||isNaN(percent)||!gender||!age) return null;
  const table = BODYFAT_TABLE[gender]; if(!table) return null;
  const band = table.find(b=>Number(age)<=b.max) || table[table.length-1];
  const p = Number(percent);
  for(const [lo,hi,label,tone] of band.ranges){ if(p>=lo && p<hi) return {label,tone}; }
  return null;
}
function classifyMuscleMass(muscleKg,weightKg,gender){
  if(!muscleKg||!weightKg||!gender) return null;
  const pct = (Number(muscleKg)/Number(weightKg))*100;
  const norm = gender==='หญิง' ? [25,30] : [35,40];
  let label,tone;
  if(pct<norm[0]){label='ต่ำกว่าเกณฑ์';tone='amber';}
  else if(pct<=norm[1]){label='ปกติ';tone='green';}
  else {label='สูงกว่าเกณฑ์';tone='blue';}
  return {label,tone,pct:Math.round(pct*10)/10};
}
function classifyVisceralFat(level){
  if(level===''||level==null||isNaN(level)) return null;
  level = Number(level);
  if(level<=9) return {label:'ปกติ',tone:'green'};
  if(level<=14) return {label:'เริ่มมีความเสี่ยง',tone:'amber'};
  return {label:'มีความเสี่ยงสูง',tone:'red'};
}
function classifyBodyWater(percent,gender){
  if(percent===''||percent==null||isNaN(percent)||!gender) return null;
  const range = gender==='หญิง' ? [45,60] : [50,65];
  const p = Number(percent);
  if(p<range[0]) return {label:'ต่ำกว่าเกณฑ์',tone:'amber'};
  if(p>range[1]) return {label:'สูงกว่าเกณฑ์',tone:'blue'};
  return {label:'ปกติ',tone:'green'};
}
function classifyStressGauge(v){
  if(v===''||v==null||isNaN(v)) return null;
  v=Number(v);
  if(v<34) return {label:'ไม่ดี',tone:'red'};
  if(v<67) return {label:'ปกติ',tone:'amber'};
  return {label:'ดี',tone:'green'};
}
function dominantVascularType(rec){
  const keys=['vascular_type1_percent','vascular_type2_percent','vascular_type3_percent','vascular_type4_percent','vascular_type5_percent','vascular_type6_percent','vascular_type7_percent'];
  let max=-1, idx=-1;
  keys.forEach((k,i)=>{ const v=Number(rec[k]); if(!isNaN(v) && v>max){max=v; idx=i;} });
  if(idx===-1||max<=0) return null;
  return 'Type'+(idx+1);
}

const $ = (sel,root=document)=>root.querySelector(sel);
const $$ = (sel,root=document)=>Array.from(root.querySelectorAll(sel));
function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstChild; }
function escapeHtml(str){ if(str===null||str===undefined) return ''; return String(str).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(){ return 'REC-'+Date.now().toString(36).toUpperCase()+'-'+Math.floor(1000+Math.random()*9000); }
function nowIso(){ return new Date().toISOString(); }
function fmtDate(iso){ if(!iso) return '-'; try{ const d=new Date(iso); return d.toLocaleString('th-TH',{dateStyle:'medium',timeStyle:'short'}); }catch(e){ return iso; } }
function debounce(fn,ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a),ms); }; }
function toast(msg,type='success'){
  const t = el(`<div class="toast ${type}">${escapeHtml(msg)}</div>`);
  $('#toastWrap').appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transform='translateX(30px)'; t.style.transition='.3s'; setTimeout(()=>t.remove(),300); }, 3600);
}
function openModal(innerHtml, opts={}){
  const root = $('#modalRoot');
  const overlay = el(`<div class="overlay"><div class="modal">${innerHtml}</div></div>`);
  root.appendChild(overlay);
  overlay.addEventListener('click',e=>{ if(e.target===overlay && opts.closable!==false) closeModal(); });
  return overlay;
}
function closeModal(){ $('#modalRoot').innerHTML=''; }
function confirmDialog(title, message, onConfirm, danger=true){
  const m = openModal(`
    <div class="modal-head"><h3>${escapeHtml(title)}</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <p style="font-size:14px;color:var(--text-muted);line-height:1.7;">${escapeHtml(message)}</p>
    <div class="actions-row">
      <button class="btn ${danger?'btn-danger':'btn-primary'}" id="confirmYes">ยืนยัน</button>
      <button class="btn btn-secondary" onclick="closeModal()">ยกเลิก</button>
    </div>`);
  $('#confirmYes',m).onclick = ()=>{ closeModal(); onConfirm(); };
}
function toCsv(rows, headers){
  const esc = v => { const s = (v===null||v===undefined)?'':String(v); return '"'+s.replace(/"/g,'""')+'"'; };
  const lines = [headers.map(esc).join(',')];
  rows.forEach(r=> lines.push(headers.map(h=>esc(r[h])).join(',')) );
  return '﻿'+lines.join('\r\n');
}
function downloadFile(filename, content, mime){
  const blob = new Blob([content],{type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); },500);
}

    let remain=100-vt[dom];
    for(let k=0;k<7;k++){ if(k!==dom){ const share=Math.random()*remain*0.4; vt[k]=Math.round(share*10)/10; remain-=vt[k]; } }

function applyFiltersJS(records, params={}){
  let out = records;
  if(params.gender) out = out.filter(r=>r.gender===params.gender);
  if(params.date_from) out = out.filter(r=> String(r.created_at) >= String(params.date_from));
  if(params.date_to) out = out.filter(r=> String(r.created_at) <= String(params.date_to)+'T23:59:59');
  if(params.status) out = out.filter(r=> r.record_status===params.status);
  if(params.q){ const q=params.q.toLowerCase(); out = out.filter(r=> (String(r.first_name)+String(r.last_name)+String(r.record_id)+String(r.phone)).toLowerCase().includes(q) ); }
  return out;
}
function stripPII(rec){ const c={...rec}; PII_FIELDS.forEach(k=>delete c[k]); return c; }
function average(values){ const v=values.map(Number).filter(n=>!isNaN(n)); if(!v.length) return null; return Math.round((v.reduce((a,b)=>a+b,0)/v.length)*100)/100; }
function buildSummaryJS(records){
  const total=records.length;
  const genderCount={'ชาย':0,'หญิง':0};
  const bmiCategory={'น้ำหนักต่ำกว่าเกณฑ์':0,'ปกติ':0,'น้ำหนักเกิน':0,'โรคอ้วน':0,'โรคอ้วนระดับรุนแรง':0};
  const waistRisk={'ปกติ':0,'เกินเกณฑ์มาตรฐานเอเชีย':0};
  const visceralRisk={'ปกติ':0,'เริ่มมีความเสี่ยง':0,'มีความเสี่ยงสูง':0};
  const vascularTypeDominant={Type1:0,Type2:0,Type3:0,Type4:0,Type5:0,Type6:0,Type7:0};
  const stressBuckets={'ไม่ดี':0,'ปกติ':0,'ดี':0};
  const diseaseCount={diabetes:0,hypertension:0,lipid:0,other:0};
  records.forEach(r=>{
    if(genderCount[r.gender]!==undefined) genderCount[r.gender]++;
    const b=classifyBMI(r.bmi); if(b && bmiCategory[b.label]!==undefined) bmiCategory[b.label]++;
    const w=classifyWaist(r.waist_cm,r.gender); if(w && waistRisk[w.label]!==undefined) waistRisk[w.label]++;
    const v=classifyVisceralFat(r.visceral_fat_level); if(v && visceralRisk[v.label]!==undefined) visceralRisk[v.label]++;
    const dom=dominantVascularType(r); if(dom) vascularTypeDominant[dom]++;
    const s=classifyStressGauge(r.stress_level); if(s && stressBuckets[s.label]!==undefined) stressBuckets[s.label]++;
    if(r.disease_diabetes===true) diseaseCount.diabetes++;
    if(r.disease_hypertension===true) diseaseCount.hypertension++;
    if(r.disease_lipid===true) diseaseCount.lipid++;
    if(r.disease_other===true) diseaseCount.other++;
  });
  const avg = {
    age:average(records.map(r=>r.age)), bmi:average(records.map(r=>r.bmi)), weight_kg:average(records.map(r=>r.weight_kg)),
    body_fat_percent:average(records.map(r=>r.body_fat_percent)), muscle_mass_kg:average(records.map(r=>r.muscle_mass_kg)),
    body_water_percent:average(records.map(r=>r.body_water_percent)), visceral_fat_level:average(records.map(r=>r.visceral_fat_level)),
    bmr:average(records.map(r=>r.bmr)), waist_cm:average(records.map(r=>r.waist_cm)),
    physical_stress:average(records.map(r=>r.physical_stress)), mental_stress:average(records.map(r=>r.mental_stress)), stress_level:average(records.map(r=>r.stress_level))
  };
  return {total,genderCount,bmiCategory,waistRisk,visceralRisk,vascularTypeDominant,stressBuckets,diseaseCount,avg,lastUpdated:nowIso()};
}

    return this._get({action:'get', record_id, token});
  },
  async summary(params={}){
    if(this.isDashboardDemo()){
      seedDemoData();
      const recs = applyFiltersJS(getLocalRecords().filter(r=>r.record_status!=='deleted'), params);
      return {success:true, data: buildSummaryJS(recs)};
    }
    return this._get({action:'summary', ...params});
  },
  async create(payload){
    if(this.isDemo()){
      seedDemoData();
      const recs = getLocalRecords();
      const now = nowIso();
      const rec = { record_id:uid(), created_at:now, updated_at:now, record_status:'active', created_by:'public_form', updated_by:'' };
      FIELD_SCHEMA.forEach(f=>{ if(!f.system) rec[f.key] = payload[f.key] !== undefined ? payload[f.key] : ''; });
      if(!rec.bmi && rec.height_cm && rec.weight_kg){ const hM=Number(rec.height_cm)/100; rec.bmi = Math.round((Number(rec.weight_kg)/(hM*hM))*100)/100; }
      recs.push(rec); saveLocalRecords(recs);
      return {success:true,message:'บันทึกข้อมูลสำเร็จ (Demo Mode - เก็บใน Local Storage ของเบราว์เซอร์นี้)', data:rec};
    }
    return this._post({action:'create', payload});
  },
  async update(payload){
    if(this.isDemo()){
      const recs = getLocalRecords();
      const idx = recs.findIndex(r=>r.record_id===payload.record_id);
      if(idx===-1) return {success:false,message:'ไม่พบรายการ'};
      recs[idx] = {...recs[idx], ...payload, updated_at:nowIso(), updated_by: (JSON.parse(localStorage.getItem(LS_KEYS.token+'_user')||'null'))||'admin'};
      saveLocalRecords(recs);
      return {success:true,message:'แก้ไขข้อมูลสำเร็จ',data:recs[idx]};
    }
    const token = localStorage.getItem(LS_KEYS.token) || '';
    return this._post({action:'update', payload, auth:{token}});
  },
  async remove(record_id){
    if(this.isDemo()){
      const recs = getLocalRecords();
      const idx = recs.findIndex(r=>r.record_id===record_id);
      if(idx===-1) return {success:false,message:'ไม่พบรายการ'};
      recs[idx].record_status='deleted'; recs[idx].updated_at=nowIso();
      saveLocalRecords(recs);
      return {success:true,message:'ลบข้อมูลสำเร็จ'};
    }
    const token = localStorage.getItem(LS_KEYS.token) || '';
    return this._post({action:'delete', record_id, auth:{token}});
  },
  async adminLogin(username,password){
    if(this.isDemo()){
      const admin = getLocalAdmin();
      if(username===admin.username && password===admin.password){
        const token = 'demo-'+Date.now();
        localStorage.setItem(LS_KEYS.token, token);
        localStorage.setItem(LS_KEYS.token+'_user', JSON.stringify(username));
        return {success:true,data:{token,username}};
      }
      return {success:false,message:'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง'};
    }
    return this._post({action:'adminLogin', username, password});
  },
  async changeAdminCredential(newUsername,newPassword){
    if(this.isDemo()){
      localStorage.setItem(LS_KEYS.admin, JSON.stringify({username:newUsername,password:newPassword}));
      return {success:true,message:'เปลี่ยนบัญชีผู้ดูแลสำเร็จ'};
    }
    const token = localStorage.getItem(LS_KEYS.token) || '';
    return this._post({action:'changeAdminCredential', auth:{token}, newUsername, newPassword});
  },
  async _get(params){
    try{
      const url = new URL(CONFIG.GAS_API_URL);
      Object.entries(params).forEach(([k,v])=>{ if(v!==undefined && v!==null && v!=='') url.searchParams.set(k,v); });
      const res = await fetch(url.toString(), {method:'GET'});
      return await res.json();
    }catch(e){ return {success:false, message:'ไม่สามารถเชื่อมต่อ API ได้ กรุณาตรวจสอบอินเทอร์เน็ตหรือ GAS_API_URL', error:String(e)}; }
  },
  async _post(body){
    try{
      const res = await fetch(CONFIG.GAS_API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(body) });
      return await res.json();
    }catch(e){ return {success:false, message:'ไม่สามารถเชื่อมต่อ API ได้ กรุณาตรวจสอบอินเทอร์เน็ตหรือ GAS_API_URL', error:String(e)}; }
  }
};

function applyBranding(){
  const b = JSON.parse(localStorage.getItem(LS_KEYS.branding)||'{}');
  const name = b.systemName || CONFIG.systemName;
  const org = b.orgName || CONFIG.orgName;
  const logo = b.logoEmoji || CONFIG.logoEmoji;
  const color = b.primaryColor || CONFIG.primaryColor;
  const color2 = b.secondaryColor || CONFIG.secondaryColor;
  $('#brandTitle').textContent = name;
  $('#brandSubtitle').textContent = org;
  $('#brandLogo').textContent = logo;
  document.title = name;
  document.documentElement.style.setProperty('--primary', color);
  document.documentElement.style.setProperty('--primary-dark', shadeColor(color,-12));
  document.documentElement.style.setProperty('--primary-light', shadeColor(color,32));
  document.documentElement.style.setProperty('--secondary', color2);
}
function shadeColor(hex, percent){
  try{
    let f=parseInt(hex.slice(1),16), t=percent<0?0:255, p=Math.abs(percent)/100;
    let R=f>>16, G=f>>8&0x00FF, B=f&0x0000FF;
    const nr=Math.round((t-R)*p)+R, ng=Math.round((t-G)*p)+G, nb=Math.round((t-B)*p)+B;
    return '#'+(0x1000000+nr*0x10000+ng*0x100+nb).toString(16).slice(1);
  }catch(e){ return hex; }
}

  state.route = route;

function bindStepEvents(stepNum){
  // text/number inputs
  $$('#formStepArea input.input').forEach(inp=>{
    const key = inp.id.replace('f_','');
    inp.addEventListener('input', ()=>{
      setFieldValue(key, inp.value);
      clearFieldError(key);
      if(['height_cm','weight_kg'].includes(key)) recomputeBmi();
      if(key.startsWith('vascular_type')) updateVascularSum();
    });
  });
  // gauge sliders — capture the visible default immediately so it isn't silently omitted if the user never drags it
  $$('#formStepArea input.gauge').forEach(inp=>{
    const key = inp.id.replace('f_','');
    if(fieldValue(key)==='') setFieldValue(key, Number(inp.value));
    inp.addEventListener('input', ()=>{ setFieldValue(key, Number(inp.value)); $('#v_'+key).textContent = inp.value; });
  });
  // gender choice cards
  const genderGroup = $('#f_gender');
  if(genderGroup){
    $$('.choice-card', genderGroup).forEach(card=>{
      card.addEventListener('click', ()=>{
        $$('.choice-card', genderGroup).forEach(c=>c.classList.remove('selected'));
        card.classList.add('selected');
        setFieldValue('gender', card.dataset.value);
        clearFieldError('gender');
      });
    });
  }
  // disease checkboxes
  const diseaseGroup = $('#diseaseGroup');
  if(diseaseGroup){
    $$('.choice-card', diseaseGroup).forEach(card=>{
      card.addEventListener('click', ()=>{
        card.classList.toggle('selected');
        const key = card.dataset.key;
        setFieldValue(key, card.classList.contains('selected'));
        if(key==='disease_other'){
          $('#otherDetailWrap').classList.toggle('hidden', !card.classList.contains('selected'));
        }
      });
    });
  }
  if(stepNum===3) updateVascularSum();
}
function clearFieldError(key){ $(`.field[data-field="${key}"]`)?.classList.remove('invalid'); }
function recomputeBmi(){
  const h = Number(fieldValue('height_cm')), w = Number(fieldValue('weight_kg'));
  if(h>0 && w>0){
    const bmi = Math.round((w/((h/100)**2))*100)/100;
    setFieldValue('bmi', bmi);
    const bmiInput = $('#f_bmi'); if(bmiInput) bmiInput.value = bmi;
  }
}
function updateVascularSum(){
  const keys=['vascular_type1_percent','vascular_type2_percent','vascular_type3_percent','vascular_type4_percent','vascular_type5_percent','vascular_type6_percent','vascular_type7_percent'];
  const sum = keys.reduce((a,k)=> a + (Number(fieldValue(k))||0), 0);
  const hint = $('#vascularSumHint');
  if(hint){
    hint.textContent = `รวมทั้งหมด: ${sum}%` + (sum>100 ? ' — เกิน 100% กรุณาตรวจสอบ' : '');
    hint.style.color = sum>100 ? 'var(--danger)' : 'var(--text-muted)';
  }
}

function validateStep(stepNum){
  const fields = FIELD_SCHEMA.filter(f=>f.step===stepNum && f.required);
  let ok = true;
  fields.forEach(f=>{
    const val = fieldValue(f.key);
    const box = $(`.field[data-field="${f.key}"]`);
    let valid = val !== '' && val !== undefined && val !== null;
    if(valid && f.type==='number'){
      const n = Number(val);
      valid = !isNaN(n) && (f.min===undefined || n>=f.min) && (f.max===undefined || n<=f.max);
    }
    if(!valid){ ok=false; box?.classList.add('invalid'); } else { box?.classList.remove('invalid'); }
  });
  if(!ok) toast('กรุณากรอกข้อมูลที่จำเป็น (*) ให้ครบถ้วนและถูกต้อง','error');
  return ok;
}

async function submitForm(){
  if(state.submitting) return;
  // ตรวจสอบทุก step ก่อนบันทึกจริง
  for(let s=1;s<=3;s++){ if(!validateStep(s)){ state.formStep=s; renderFormView(); toast('กรุณาตรวจสอบข้อมูลในขั้นตอนที่ '+s,'error'); return; } }
  const sumVascular = ['vascular_type1_percent','vascular_type2_percent','vascular_type3_percent','vascular_type4_percent','vascular_type5_percent','vascular_type6_percent','vascular_type7_percent'].reduce((a,k)=>a+(Number(state.formData[k])||0),0);
  if(sumVascular>100){ toast('สัดส่วน Type หลอดเลือดรวมกันเกิน 100% กรุณาตรวจสอบ','error'); state.formStep=3; renderFormView(); return; }

  state.submitting = true;
  const btn = $('#btnSubmit');
  if(btn){ btn.disabled=true; btn.innerHTML = '<span class="spinner"></span> กำลังบันทึก...'; }
  try{
    const res = await DataAPI.create(state.formData);
    if(res.success){
      toast(res.message||'บันทึกข้อมูลสำเร็จ','success');
      localStorage.removeItem(LS_KEYS.draft);
      showSuccessScreen(res.data);
    } else {
      toast(res.message||'บันทึกข้อมูลไม่สำเร็จ','error');
      if(btn){ btn.disabled=false; btn.innerHTML='✔ บันทึกข้อมูล'; }
    }
  } catch(e){
    toast('เกิดข้อผิดพลาด: '+e.message,'error');
    if(btn){ btn.disabled=false; btn.innerHTML='✔ บันทึกข้อมูล'; }
  }
  state.submitting = false;
}

function drawDonut(id, dataObj, colors){
  const svg = document.getElementById(id); if(!svg) return;
  const entries = Object.entries(dataObj).filter(([k,v])=>v>0);
  const total = entries.reduce((a,[,v])=>a+v,0);
  const cx=90, cy=90, r=62, rInner=36;
  let angle = -Math.PI/2;
  let paths = '';
  if(total===0){ svg.innerHTML = `<text x="150" y="95" text-anchor="middle" fill="var(--text-muted)" font-size="12">ไม่มีข้อมูล</text>`; return; }
  entries.forEach(([label,val],i)=>{
    const frac = val/total; const sweep = frac*Math.PI*2;
    const x1=cx+r*Math.cos(angle), y1=cy+r*Math.sin(angle);
    const x2=cx+r*Math.cos(angle+sweep), y2=cy+r*Math.sin(angle+sweep);
    const large = sweep>Math.PI?1:0;
    const ix1=cx+rInner*Math.cos(angle+sweep), iy1=cy+rInner*Math.sin(angle+sweep);
    const ix2=cx+rInner*Math.cos(angle), iy2=cy+rInner*Math.sin(angle);
    paths += `<path d="M${x1},${y1} A${r},${r} 0 ${large} 1 ${x2},${y2} L${ix1},${iy1} A${rInner},${rInner} 0 ${large} 0 ${ix2},${iy2} Z" fill="${colors[i%colors.length]}"><title>${label}: ${val}</title></path>`;
    angle += sweep;
  });
  const legend = entries.map(([label,val],i)=>`<g transform="translate(190,${20+i*22})"><rect width="11" height="11" rx="3" fill="${colors[i%colors.length]}"/><text x="17" y="10" font-size="10.5" fill="var(--text)">${escapeHtml(label)} (${val})</text></g>`).join('');
  svg.innerHTML = `<g>${paths}</g><text x="90" y="94" text-anchor="middle" font-size="16" font-weight="700" fill="var(--text)">${total}</text>${legend}`;
}
function drawBars(id, dataObj, colors){
  const svg = document.getElementById(id); if(!svg) return;
  const entries = Object.entries(dataObj);
  const max = Math.max(1, ...entries.map(([,v])=>v));
  const barH = 20, gap=8, top=10, chartW=170;
  let bars='';
  entries.forEach(([label,val],i)=>{
    const y = top + i*(barH+gap);
    const w = (val/max)*chartW;
    bars += `<text x="0" y="${y+14}" font-size="10.5" fill="var(--text)">${escapeHtml(label)}</text>
      <rect x="95" y="${y}" width="${chartW}" height="${barH}" rx="6" fill="var(--surface-2)"/>
      <rect x="95" y="${y}" width="${Math.max(2,w)}" height="${barH}" rx="6" fill="${colors[i%colors.length]}"><title>${label}: ${val}</title></rect>
      <text x="${95+chartW+8}" y="${y+14}" font-size="10.5" fill="var(--text)">${val}</text>`;
  });
  svg.setAttribute('viewBox', `0 0 300 ${top + entries.length*(barH+gap)+10}`);
  svg.innerHTML = bars;
}

async function renderAdminRecords(){
  const body = $('#adminTabBody');
  body.innerHTML = `
  <div class="card-solid">
    <div class="toolbar">
      <input class="input" id="admSearch" placeholder="🔎 ค้นหาชื่อ/รหัสรายการ/เบอร์โทร">

      <button class="btn btn-primary btn-sm" id="admFilterBtn">กรอง</button>
      <span style="flex:1"></span>
      <button class="btn btn-secondary btn-sm" id="admExportCsv">⬇ Excel/CSV</button>
      <button class="btn btn-secondary btn-sm" id="admExportJson">⬇ JSON</button>
      <button class="btn btn-secondary btn-sm" id="admPrint">🖨 พิมพ์รายงาน</button>
      <button class="btn btn-primary btn-sm" id="admAddNew">＋ เพิ่มรายการ</button>
    </div>

  </div>`;
  $('#admFilterBtn').addEventListener('click', loadAdminRecords);
  $('#admSearch').addEventListener('input', debounce(loadAdminRecords,400));
  $('#admExportCsv').addEventListener('click', exportCurrentCsv);
  $('#admExportJson').addEventListener('click', exportCurrentJson);
  $('#admPrint').addEventListener('click', ()=>window.print());
  $('#admAddNew').addEventListener('click', ()=>openRecordEditor(null));

let _adminCurrentList = [];
async function loadAdminRecords(){
  const params = { q: $('#admSearch').value, gender: $('#admGender').value, status: $('#admStatus').value };
  const res = await DataAPI.list(params);
  if(!res.success){ $('#admTableArea').innerHTML = `<div class="empty-state">⚠️ ${escapeHtml(res.message||'โหลดข้อมูลไม่สำเร็จ')}</div>`; return; }
  _adminCurrentList = res.data;
  if(!res.data.length){ $('#admTableArea').innerHTML = `<div class="empty-state"><div class="emoji">📭</div>ไม่พบข้อมูล</div>`; return; }
  $('#admTableArea').innerHTML = `
  <table class="data-table">
    <thead><tr><th>รหัส</th><th>ชื่อ-สกุล</th><th>เพศ/อายุ</th><th>BMI</th><th>รอบเอว</th><th>สถานะ</th><th>บันทึกเมื่อ</th><th>จัดการ</th></tr></thead>
    <tbody>
      ${res.data.map(r=>{
        const bmiC = classifyBMI(r.bmi);
        return `<tr>
          <td><code>${escapeHtml(r.record_id)}</code></td>
          <td>${escapeHtml(r.first_name)} ${escapeHtml(r.last_name)}</td>
          <td>${escapeHtml(r.gender)} / ${escapeHtml(r.age)}</td>
          <td>${escapeHtml(r.bmi)} ${bmiC?`<span class="badge badge-${bmiC.tone}">${bmiC.label}</span>`:''}</td>
          <td>${escapeHtml(r.waist_cm)} ซม.</td>
          <td>${r.record_status==='deleted'?'<span class="badge badge-red">ลบแล้ว</span>':'<span class="badge badge-green">ใช้งาน</span>'}</td>
          <td>${fmtDate(r.created_at)}</td>
          <td style="white-space:nowrap;">
            <button class="btn btn-secondary btn-sm" onclick="viewRecordDetail('${r.record_id}')">👁</button>
            <button class="btn btn-secondary btn-sm" onclick="openRecordEditor('${r.record_id}')">✏️</button>
            <button class="btn btn-danger btn-sm" onclick="deleteRecordConfirm('${r.record_id}')">🗑</button>
          </td>
        </tr>`;
      }).join('')}
    </tbody>
  </table>`;
}
function exportCurrentCsv(){
  if(!_adminCurrentList.length) return toast('ไม่มีข้อมูลให้ส่งออก','warn');
  const csv = toCsv(_adminCurrentList, FIELD_KEYS);
  downloadFile('health_check_records_'+Date.now()+'.csv', csv, 'text/csv;charset=utf-8');
  toast('ส่งออกไฟล์ CSV (เปิดได้ด้วย Excel/Google Sheets) สำเร็จ','success');
}
function exportCurrentJson(){
  if(!_adminCurrentList.length) return toast('ไม่มีข้อมูลให้ส่งออก','warn');
  downloadFile('health_check_records_'+Date.now()+'.json', JSON.stringify(_adminCurrentList,null,2), 'application/json');
  toast('ส่งออกไฟล์ JSON สำเร็จ','success');
}
async function viewRecordDetail(id){
  const res = await DataAPI.get(id);
  if(!res.success) return toast(res.message||'ไม่พบข้อมูล','error');
  const r = res.data;
  const rows = FIELD_SCHEMA.filter(f=>!f.system).map(f=>`<tr><td style="color:var(--text-muted);">${escapeHtml(f.label)}</td><td><b>${f.type==='boolean'?(r[f.key]===true||r[f.key]==='TRUE'?'✔ มี':'—'):escapeHtml(r[f.key]??'-')}</b></td></tr>`).join('');
  openModal(`
  <div class="modal-head"><h3>รายละเอียดรายการ ${escapeHtml(r.record_id)}</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
  <div class="table-wrap"><table class="data-table">${rows}</table></div>
  <div class="actions-row"><button class="btn btn-secondary" onclick="closeModal()">ปิด</button></div>`);
}
function deleteRecordConfirm(id){
  confirmDialog('ยืนยันการลบข้อมูล', `ต้องการลบรายการ ${id} หรือไม่? ระบบจะเปลี่ยนสถานะเป็น "ลบแล้ว" (Soft Delete) และสามารถกู้คืนได้ผ่าน Google Sheets`, async ()=>{
    const res = await DataAPI.remove(id);
    toast(res.message||(res.success?'ลบสำเร็จ':'ลบไม่สำเร็จ'), res.success?'success':'error');
    loadAdminRecords();
  });
}
function openRecordEditor(id){
  const isNew = !id;
  const rec = isNew ? {} : _adminCurrentList.find(r=>r.record_id===id) || {};
  const fields = FIELD_SCHEMA.filter(f=>!f.system);
  const body = fields.map(f=>{
    if(f.type==='boolean') return `<div class="field"><label>${escapeHtml(f.label)}</label><select class="input" id="ed_${f.key}"><option value="false" ${!rec[f.key]?'selected':''}>ไม่มี</option><option value="true" ${rec[f.key]===true||rec[f.key]==='TRUE'?'selected':''}>มี</option></select></div>`;
    if(f.type==='select') return `<div class="field"><label>${escapeHtml(f.label)}</label><select class="input" id="ed_${f.key}">${f.options.map(o=>`<option value="${o}" ${rec[f.key]===o?'selected':''}>${o}</option>`).join('')}</select></div>`;
    return `<div class="field"><label>${escapeHtml(f.label)}${f.unit?` (${f.unit})`:''}</label><input class="input" id="ed_${f.key}" type="${f.type==='number'?'number':'text'}" value="${escapeHtml(rec[f.key]??'')}"></div>`;
  }).join('');
  const m = openModal(`
  <div class="modal-head"><h3>${isNew?'➕ เพิ่มรายการใหม่':'✏️ แก้ไขรายการ '+escapeHtml(id)}</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
  <div class="grid grid-2">${body}</div>
  <div class="actions-row"><button class="btn btn-primary" id="edSave">บันทึก</button><button class="btn btn-secondary" onclick="closeModal()">ยกเลิก</button></div>`);
  $('#edSave',m).addEventListener('click', async ()=>{
    const payload = isNew ? {} : {record_id:id};
    fields.forEach(f=>{
      const inp = $('#ed_'+f.key,m); let v = inp.value;
      if(f.type==='boolean') v = v==='true';
      payload[f.key]=v;
    });
    confirmDialog(isNew?'ยืนยันการเพิ่มรายการ':'ยืนยันการแก้ไขข้อมูล','กรุณาตรวจสอบข้อมูลก่อนบันทึก ต้องการดำเนินการต่อหรือไม่?', async ()=>{
      const res = isNew ? await DataAPI.create(payload) : await DataAPI.update(payload);
      toast(res.message||(res.success?'บันทึกสำเร็จ':'บันทึกไม่สำเร็จ'), res.success?'success':'error');
      if(res.success){ closeModal(); loadAdminRecords(); }
    }, false);
  });
}
